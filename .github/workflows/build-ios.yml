name: Build Harbor for iPhone

on:
  workflow_dispatch:
    inputs:
      signed_testflight:
        description: 'Build a signed App Store/TestFlight IPA (requires Apple signing secrets)'
        required: true
        type: boolean
        default: false
      upload_testflight:
        description: 'Also upload the signed build to App Store Connect for TestFlight'
        required: true
        type: boolean
        default: false
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: harbor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate manual delivery selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight && !inputs.signed_testflight }}
        run: |
          echo '::error::TestFlight upload requires signed_testflight=true. Both options default to false.'
          exit 1
      - name: Locate project and show Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          project_path=$(find "$GITHUB_WORKSPACE" -name HarborBrowser.xcodeproj -type d -print -quit)
          test -n "$project_path"
          echo "HARBOR_PROJECT=$project_path" >> "$GITHUB_ENV"
          echo "HARBOR_ROOT=$(dirname "$project_path")" >> "$GITHUB_ENV"
      - name: Prepare enhanced ad and tracking lists
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$HARBOR_PROJECT")"
          python3 scripts/prepare_filters.py
      - name: Verify rules with WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$HARBOR_PROJECT")"
          swift scripts/validate_filters.swift HarborBrowser/Filters/enhanced.json
      - name: Preserve filter source and attribution
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-filter-sources-and-report
          path: ${{ env.HARBOR_ROOT }}/HarborBrowser/Filters/
          retention-days: 30
      - name: Build for iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$HARBOR_PROJECT" \
            -scheme HarborBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/harbor-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harbor-package/Payload" "$GITHUB_WORKSPACE/build-output"
          ditto "$RUNNER_TEMP/harbor-device/Build/Products/Release-iphoneos/HarborBrowser.app" \
            "$RUNNER_TEMP/harbor-package/Payload/HarborBrowser.app"
          cd "$RUNNER_TEMP/harbor-package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/build-output/Harbor-unsigned.ipa" Payload
      - name: Test browser on iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(python3 "$HARBOR_ROOT/scripts/select_iphone_simulator.py")
          device_state=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["state"] for group in devices.values() for d in group if d["udid"] == sys.argv[1]))' "$device_id")
          if [ "$device_state" != Booted ]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          python3 "$(dirname "$HARBOR_PROJECT")/scripts/serve_test_media.py" > "$RUNNER_TEMP/media-fixture.log" 2>&1 &
          media_fixture_pid=$!
          trap 'kill "$media_fixture_pid" || true' EXIT
          xcodebuild test -project "$HARBOR_PROJECT" -scheme HarborBrowser -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/harbor-simulator" \
            -resultBundlePath "$GITHUB_WORKSPACE/build-output/HarborTests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test -d "$GITHUB_WORKSPACE/build-output/HarborTests.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$GITHUB_WORKSPACE/build-output/HarborTests.xcresult" --output-path "$GITHUB_WORKSPACE/build-output/screenshots"
      - name: Upload simulator screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-screenshots
          path: build-output/screenshots
          retention-days: 7
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-test-results
          path: build-output/HarborTests.xcresult
          retention-days: 7
      - name: Upload unsigned iPhone IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iPhone-UNSIGNED-needs-signing
          path: build-output/Harbor-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-Simulator-only
          path: ${{ runner.temp }}/harbor-simulator/Build/Products/Debug-iphonesimulator/HarborBrowser.app
          if-no-files-found: error
          retention-days: 7

  signed_build:
    name: Optional signed App Store IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_testflight }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          project_path=$(find "$GITHUB_WORKSPACE" -name HarborBrowser.xcodeproj -type d -print -quit)
          test -n "$project_path"
          echo "HARBOR_PROJECT=$project_path" >> "$GITHUB_ENV"
          echo "HARBOR_ROOT=$(dirname "$project_path")" >> "$GITHUB_ENV"
      - name: Reuse the filter pack verified by the build job
        uses: actions/download-artifact@v4
        with:
          name: Harbor-filter-sources-and-report
          path: ${{ env.HARBOR_ROOT }}/HarborBrowser/Filters/
      - name: Archive and export with Apple signing assets
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash "$HARBOR_ROOT/scripts/ci-sign-ios.sh" archive
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-AppStore-SIGNED
          path: build-output/signed/Harbor.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${HARBOR_ROOT:-}" ]; then
            bash "$HARBOR_ROOT/scripts/ci-sign-ios.sh" cleanup
          fi

  upload_testflight:
    name: Explicit TestFlight upload
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_testflight && inputs.upload_testflight }}
    needs: signed_build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate signing script
        shell: bash
        run: |
          set -euo pipefail
          script_path=$(find "$GITHUB_WORKSPACE" -path '*/scripts/ci-sign-ios.sh' -type f -print -quit)
          test -n "$script_path"
          echo "HARBOR_SIGN_SCRIPT=$script_path" >> "$GITHUB_ENV"
      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: Harbor-AppStore-SIGNED
          path: build-output/signed/
      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash "$HARBOR_SIGN_SCRIPT" upload
      - name: Remove temporary API key
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${HARBOR_SIGN_SCRIPT:-}" ]; then
            bash "$HARBOR_SIGN_SCRIPT" cleanup
          fi
