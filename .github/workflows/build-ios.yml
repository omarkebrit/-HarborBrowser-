name: Build Harbor for iPhone

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: harbor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate project and show Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          project_path=$(find "$GITHUB_WORKSPACE" -name HarborBrowser.xcodeproj -type d -print -quit)
          test -n "$project_path"
          echo "HARBOR_PROJECT=$project_path" >> "$GITHUB_ENV"
      - name: Prepare enhanced ad and tracking lists
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$HARBOR_PROJECT")"
          python3 scripts/prepare_filters.py
      - name: Verify rules with WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$HARBOR_PROJECT")"
          swift scripts/validate_filters.swift HarborBrowser/Filters/enhanced.json
      - name: Preserve filter source and attribution
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-filter-sources-and-report
          path: HarborBrowser/Filters/
          retention-days: 30
      - name: Build for iPhone without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$HARBOR_PROJECT" \
            -scheme HarborBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/harbor-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harbor-package/Payload" "$GITHUB_WORKSPACE/build-output"
          ditto "$RUNNER_TEMP/harbor-device/Build/Products/Release-iphoneos/HarborBrowser.app" \
            "$RUNNER_TEMP/harbor-package/Payload/HarborBrowser.app"
          cd "$RUNNER_TEMP/harbor-package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/build-output/Harbor-unsigned.ipa" Payload
      - name: Test browser on iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test -project "$HARBOR_PROJECT" -scheme HarborBrowser -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/harbor-simulator" \
            -resultBundlePath "$GITHUB_WORKSPACE/build-output/HarborTests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-test-results
          path: build-output/HarborTests.xcresult
          retention-days: 7
      - name: Upload unsigned iPhone IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iPhone-UNSIGNED-needs-signing
          path: build-output/Harbor-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-Simulator-only
          path: ${{ runner.temp }}/harbor-simulator/Build/Products/Debug-iphonesimulator/HarborBrowser.app
          if-no-files-found: error
          retention-days: 7
